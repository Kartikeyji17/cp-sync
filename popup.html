<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>CP Sync</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>

<div class="container">
    <header>
        <h1>CP Sync</h1>
        <span id="statusBadge" class="badge disconnected">
            Not Connected
        </span>
    </header>
    <section class="card">
        <div class="field">

            <label id="repositoryLabel" for="repository">

                Repository

            </label>

            <select id="repository"></select>

        </div>

        <div class="field">

            <label>

                Status

            </label>

            <div id="status" class="statusBox">

                Ready

            </div>

        </div>

    </section>

    <div class="buttons">

        <button id="connect" class="secondary">

            ⚙ Settings

        </button>

        <button id="upload">

            ☁ Upload Solution

        </button>

    </div>

</div>

<div id="toastContainer"></div>

<script type="module" src="popup.js"></script>

</body>

</html>
