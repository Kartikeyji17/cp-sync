name: CP Sync Checks

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build release package
        run: npm run package

      - name: Verify release package
        shell: bash
        run: |
          test -f "dist/cp-sync-v$(node -p "require('./manifest.json').version").zip"
