<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>CP Sync Settings</title>
    <link rel="stylesheet" href="options.css">
</head>

<body>

    <main>
        <h1>CP Sync Settings</h1>

        <section>
            <label for="token">GitHub Fine-grained Personal Access Token</label>
            <input id="token" type="password" placeholder="github_pat_...">

            <button id="fetchRepos">Load Repositories</button>
            <p id="repoStatus">Repositories have not been loaded in this session.</p>
        </section>

        <section>
            <h2>Platform Repositories</h2>
            <div id="repositoryTable" class="repository-table"></div>
        </section>

        <section class="defaults-grid">
            <div>
                <label for="leetcodeDefaultRepo">LeetCode Default</label>
                <select id="leetcodeDefaultRepo"></select>
            </div>

            <div>
                <label for="codeforcesDefaultRepo">Codeforces Default</label>
                <select id="codeforcesDefaultRepo"></select>
            </div>

            <div>
                <label for="codechefDefaultRepo">CodeChef Default</label>
                <select id="codechefDefaultRepo"></select>
            </div>
        </section>

        <section>
            <label for="autoUploadMode">Upload Mode</label>
            <select id="autoUploadMode">
                <option value="manual">Manual</option>
                <option value="ask">Ask after Accepted</option>
                <option value="auto">Auto Upload</option>
            </select>
        </section>

        <button id="save">Save Settings</button>
    </main>

    <script type="module" src="options.js"></script>

</body>

</html>
